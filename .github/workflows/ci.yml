name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify LFS assets
        run: git lfs fsck
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Ensure tracked deployment assets are fresh
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            git status --short -- dist
            exit 1
          fi
