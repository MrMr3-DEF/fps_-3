<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Town visual regression viewer</title>
<style>body{margin:0;background:#d0dbf0;font:14px system-ui}canvas{display:block}nav{position:fixed;top:12px;left:12px;background:#18222ee8;color:white;padding:12px;border-radius:8px}button,input{padding:7px;margin:3px}#info{margin-top:8px}</style>
<nav><label>Seed <input id="seed" type="number" value="42" style="width:100px"></label><button id="rebuild">Rebuild</button><button id="aerial">Aerial</button><button id="street">Street</button><button id="door">Doorway</button><button id="interior">Interior</button><button id="roof">Rooftop</button><button id="church">Church</button><button id="nave">Church interior</button><button id="rampart">Rampart</button><button id="stairs">Stairs</button><button id="lookout">Lookout</button><button id="motion">Roof motion</button><button id="ground-motion">Ground motion</button><button id="goth">Goth house</button><button id="goth-interior">Goth interior</button><button id="well">Well</button><button id="house-spawn">House spawn</button><button id="death-spawn">Death respawn</button><div id="info"></div></nav>
<script type="module">
import * as THREE from 'three';
import {state} from '/src/state.ts';
import {rebuildEnvironmentWithSeed,updateEnvironmentVisibility} from '/src/world.ts';
import {generateTownLayout} from '/src/town.ts';
import {placePlayerAtTownSpawn} from '/src/playerSpawn.ts';
state.scene=new THREE.Scene();state.scene.background=new THREE.Color(0xd0dbf0);state.scene.fog=new THREE.FogExp2(0xd0dbf0,.002);
state.scene.add(new THREE.AmbientLight(0x777777));const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(750,1500,750);state.scene.add(sun);
state.camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1500);state.isMultiplayer=false;state.controls={getObject:()=>state.camera};
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
let buildings;let moving=false;let motionMode='roof';function view(name){moving=false;const b=buildings[0],side=b.doorSide,axis=b.doorAxis;
if(name==='house-spawn'||name==='death-spawn')placePlayerAtTownSpawn(Number(document.querySelector('#seed').value),name==='house-spawn'?'house':'church');
if(name==='goth'||name==='goth-interior'){const g=buildings.find(b=>b.name==='goth house');state.camera.position.set(g.x, name==='goth'?12:2, g.z);state.camera.position[g.doorAxis]-=g.doorSide*(name==='goth'?38:8);state.camera.lookAt(g.x,name==='goth'?11:3.5,g.z);}
if(name==='aerial'){state.camera.position.set(160,165,195);state.camera.lookAt(0,0,0);}
if(name==='rampart'){state.camera.position.set(90,72,35);state.camera.lookAt(90,73,-90);}
if(name==='stairs'){state.camera.position.set(-48,35,82);state.camera.lookAt(-82,35,40);}
if(name==='well'){state.camera.position.set(7,4,9);state.camera.lookAt(0,1.5,0);}
if(name==='lookout'){state.camera.position.set(90,72,-90);state.camera.lookAt(-90,72,-90);}
if(name==='street'){state.camera.position.set(0,2,9);state.camera.lookAt(0,12,-90);}
if(name==='door'){state.camera.position.set(b.x,2,b.z);state.camera.position[axis]-=side*((axis==='x'?b.width:b.depth)/2+7);state.camera.lookAt(b.x,3,b.z);}
if(name==='interior'){state.camera.position.set(b.x,2,b.z);const target=new THREE.Vector3(b.x,2,b.z);target[axis]-=side*20;state.camera.lookAt(target);}
if(name==='church'){const c=buildings.find(b=>b.kind==='church');state.camera.position.set(c.x,10,c.z);state.camera.position[c.doorAxis]-=c.doorSide*32;state.camera.lookAt(c.x,20,c.z);}
if(name==='nave'){const c=buildings.find(b=>b.kind==='church');state.camera.position.set(c.x,2,c.z);state.camera.position[c.doorAxis]-=c.doorSide*8;state.camera.lookAt(c.x,3,c.z);}
if(name==='roof'){state.camera.position.set(b.x,b.height+2,b.z);state.camera.lookAt(0,18,0);}
updateEnvironmentVisibility(state.camera.position,2);renderer.render(state.scene,state.camera);document.querySelector('#info').textContent=`${name} · ${buildings.length} buildings · ${renderer.info.render.calls} draw calls · ${renderer.info.render.triangles.toLocaleString()} triangles`;}
function rebuild(){rebuildEnvironmentWithSeed(Number(document.querySelector('#seed').value));buildings=generateTownLayout(Number(document.querySelector('#seed').value));view('aerial');}
for(const name of ['aerial','street','door','interior','roof','church','nave','rampart','stairs','lookout','goth','goth-interior','well','house-spawn','death-spawn'])document.getElementById(name).onclick=()=>view(name);document.getElementById('rebuild').onclick=rebuild;
document.getElementById('motion').onclick=()=>{moving=true;motionMode='roof';};
document.getElementById('ground-motion').onclick=()=>{moving=true;motionMode='ground';};
function animate(time){requestAnimationFrame(animate);if(!moving)return;const b=buildings.find(b=>b.kind==='house');const angle=time*.0003;if(motionMode==='ground'){state.camera.position.set(Math.cos(angle)*60,2+Math.sin(angle*.5)**2*75,Math.sin(angle)*60);state.camera.lookAt(0,0,0);}else{state.camera.position.set(b.x+Math.cos(angle)*22,b.height+1+Math.sin(angle*2)*2,b.z+Math.sin(angle)*22);state.camera.lookAt(b.x,b.height-.5,b.z);}updateEnvironmentVisibility(state.camera.position,2);renderer.render(state.scene,state.camera);document.querySelector('#info').textContent=`Moving ${motionMode} inspection · select another view to stop`;}requestAnimationFrame(animate);
addEventListener('resize',()=>{state.camera.aspect=innerWidth/innerHeight;state.camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.render(state.scene,state.camera)});rebuild();
</script></html>
