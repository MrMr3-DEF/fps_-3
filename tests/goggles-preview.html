<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart goggles preview</title>
    <link rel="stylesheet" href="/src/gameUI.css">
    <style>
        #goggles-scope { display: block; }
        #preview-note {
            position: fixed;
            top: 12px;
            left: 50%;
            z-index: 8;
            transform: translateX(-50%);
            padding: 6px 10px;
            border: 1px solid #55e7ff66;
            background: #06161ed9;
            color: #bdf7ff;
            font: 11px/1.3 ui-monospace, monospace;
            letter-spacing: 0.06em;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="preview-note">SMART GOGGLES · LIVE TRACKING / RANGE / EXIT PREVIEW</div>
    <div id="goggles-scope">
        <div class="goggles-tv-noise" aria-hidden="true"></div>
        <div class="goggles-scanlines"></div>
        <div id="goggles-target-layer" aria-hidden="true"></div>
        <div class="goggles-dot"></div>
        <div class="goggles-corner goggles-tl"></div>
        <div class="goggles-corner goggles-tr"></div>
        <div class="goggles-corner goggles-bl"></div>
        <div class="goggles-corner goggles-br"></div>
    </div>
    <script type="module">
        import * as THREE from 'three';
        import { SmartGogglesHud } from '/src/smartGoggles.ts';
        import { MOON_MEAN_DISTANCE_KM, SUN_MEAN_DISTANCE_KM } from '/src/dayNightCycle.ts';

        const previewParams = new URLSearchParams(location.search);
        const celestialPreview = previewParams.has('celestial-preview');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x07131b);
        scene.fog = new THREE.FogExp2(0x07131b, 0.0022);
        const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 1500);
        camera.position.set(0, 4, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0x8fe9ff, 0x10151f, 2.2));
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(1200, 1200),
            new THREE.MeshStandardMaterial({ color: 0x122834, roughness: 0.88 }),
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -8;
        scene.add(floor);

        function enemy(index, position, scale, hp, maxHp, color) {
            const group = new THREE.Group();
            group.position.copy(position);
            const bodyMesh = new THREE.Mesh(
                new THREE.BoxGeometry(2, 2, 2),
                new THREE.MeshStandardMaterial({ color, roughness: 0.25, emissive: color, emissiveIntensity: 0.08 }),
            );
            bodyMesh.scale.setScalar(scale);
            group.add(bodyMesh);
            const healthBarGroup = new THREE.Group();
            group.add(healthBarGroup);
            group.userData = {
                index, hp, maxHp, scale, color,
                eliminationRevision: 0,
                bodyMesh,
                healthBarGroup,
                healthBarFg: new THREE.Mesh(),
            };
            scene.add(group);
            return group;
        }

        const targets = [
            enemy(0, new THREE.Vector3(-9, 3, -68), 3, 2, 3, 0x2ed573),
            enemy(1, new THREE.Vector3(82, 24, -560), 6, 10, 10, 0xff4757),
            enemy(2, new THREE.Vector3(0, -1, -105), 1.5, 1, 1, 0x00bfff),
        ];
        const peerMesh = new THREE.Group();
        peerMesh.position.set(15, 0, -88);
        const peerMaterial = new THREE.MeshStandardMaterial({ color: 0x8c7ae6, roughness: 0.25 });
        const peerBody = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 3, 16), peerMaterial);
        const peerHead = new THREE.Mesh(new THREE.SphereGeometry(1.1, 16, 10), peerMaterial);
        peerHead.position.y = 1.45;
        peerMesh.add(peerBody, peerHead);
        scene.add(peerMesh);
        const peers = { previewPeer: { mesh: peerMesh, hp: 6, maxHp: 10 } };
        const anomalyVisual = new THREE.Group();
        anomalyVisual.position.set(-25, 0, -82);
        const anomalyMaterial = new THREE.MeshStandardMaterial({
            color: 0x35293f,
            emissive: 0xa6388f,
            emissiveIntensity: 0.24,
            roughness: 0.5,
        });
        const anomalyBody = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.62, 2.7, 12), anomalyMaterial);
        const anomalyHead = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 10), anomalyMaterial);
        anomalyHead.position.y = 1.65;
        anomalyVisual.add(anomalyBody, anomalyHead);
        scene.add(anomalyVisual);
        const anomalyHitbox = new THREE.Mesh(
            new THREE.BoxGeometry(1.1, 3.564, 0.8),
            new THREE.MeshBasicMaterial(),
        );
        anomalyHitbox.position.set(-25, 0.45, -82);
        anomalyHitbox.visible = false;
        scene.add(anomalyHitbox);
        const anomaly = { hitbox: anomalyHitbox };
        const celestialGeometry = new THREE.SphereGeometry(1, 24, 12);
        const sunPreview = new THREE.Mesh(
            celestialGeometry,
            new THREE.MeshBasicMaterial({ color: 0xfff0b0, toneMapped: false }),
        );
        sunPreview.position.set(25, 22, -150);
        sunPreview.scale.setScalar(6);
        sunPreview.visible = celestialPreview;
        scene.add(sunPreview);
        const moonPreview = new THREE.Mesh(
            celestialGeometry,
            new THREE.MeshBasicMaterial({ color: 0xdce6ff, toneMapped: false }),
        );
        moonPreview.position.set(-22, 10, -135);
        moonPreview.scale.setScalar(5);
        moonPreview.visible = celestialPreview;
        scene.add(moonPreview);
        const celestialTargets = [
            { key: 'sun', mesh: sunPreview, distanceKm: SUN_MEAN_DISTANCE_KM },
            { key: 'moon', mesh: moonPreview, distanceKm: MOON_MEAN_DISTANCE_KM },
        ];
        if (celestialPreview) {
            targets.forEach(target => { target.visible = false; });
            peerMesh.visible = false;
            anomalyVisual.visible = false;
            anomalyHitbox.visible = false;
        }
        const hud = new SmartGogglesHud(document.getElementById('goggles-target-layer'));
        const previewStartedAt = performance.now();
        const panDuringElimination = previewParams.has('elimination-pan');
        const brickPreview = previewParams.has('brick-preview');
        const photosensitivePreview = previewParams.has('photosensitive');
        const gogglesScope = document.getElementById('goggles-scope');
        const previewNote = document.getElementById('preview-note');
        if (celestialPreview) previewNote.textContent = 'SMART GOGGLES · CELESTIAL DISTANCE PREVIEW';
        gogglesScope.classList.toggle('is-photosensitivity-mode', photosensitivePreview);
        let eliminationPlayed = false;
        let brickAnimationStarted = false;
        let brickNoiseStarted = false;

        function resize() {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        }
        addEventListener('resize', resize);

        function frame(now) {
            const seconds = now / 1000;
            const previewElapsed = now - previewStartedAt;
            if (brickPreview && !brickAnimationStarted && previewElapsed >= 900) {
                gogglesScope.classList.add('is-tv-off');
                previewNote.textContent = 'SMART GOGGLES · TERMINAL ANOMALY / HARDWARE FAILURE';
                brickAnimationStarted = true;
            }
            if (brickPreview && !brickNoiseStarted && previewElapsed >= 1420) {
                gogglesScope.classList.remove('is-tv-off');
                gogglesScope.classList.add('is-bricked-noise');
                previewNote.textContent = photosensitivePreview
                    ? 'SMART GOGGLES · RESTART ATTEMPT / PHOTOSENSITIVITY MODE'
                    : 'SMART GOGGLES · RESTART ATTEMPT / NO SIGNAL';
                brickNoiseStarted = true;
            }
            if (!eliminationPlayed && previewElapsed >= 2200) {
                targets[0].userData.eliminationRevision++;
                targets[0].visible = false;
                eliminationPlayed = true;
            }
            if (panDuringElimination && previewElapsed >= 2200) {
                const panProgress = Math.min(1, (previewElapsed - 2200) / 360);
                camera.rotation.y = THREE.MathUtils.degToRad(32) * panProgress;
            }
            targets[0].children[0].rotation.set(seconds * 0.45, seconds * 0.72, 0);
            targets[1].children[0].rotation.set(seconds * 0.18, seconds * 0.34, 0);
            targets[2].children[0].rotation.set(seconds * 0.8, seconds * 1.1, 0);
            peerMesh.rotation.y = Math.sin(seconds * 0.7) * 0.5;
            // Cross the viewport completely so acquire, edge-follow and collapse
            // can be inspected without pointer-lock support.
            targets[2].position.x = Math.sin(seconds * 0.48) * 85;

            camera.updateMatrixWorld(true);
            hud.update(
                camera,
                camera.position,
                camera.position,
                celestialPreview ? [] : targets,
                celestialPreview ? {} : peers,
                true,
                now,
                celestialPreview ? null : anomaly,
                celestialTargets,
            );
            renderer.render(scene, camera);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>
</html>
