<!doctype html><html lang="en"><meta charset="utf-8"><title>Goth girlfriend animation preview</title>
<style>body{margin:0;background:#17131d;color:#eee;font:14px system-ui}canvas{display:block}nav{position:fixed;top:12px;left:12px;background:#201726ed;padding:14px;border:1px solid #81618e;border-radius:8px;max-width:600px}button,input,select{padding:7px;margin:3px}#status{margin-top:8px}#hint{position:fixed;bottom:15%;left:50%;transform:translateX(-50%);background:#201726ed;padding:12px 20px;border-radius:6px}</style>
<nav><strong>Goth girlfriend · rig animation preview</strong><br><label>Seed <input id="seed" type="number" value="42" style="width:80px"></label><button id="rebuild">Rebuild</button><button id="close">Close view</button><button id="door">Doorway</button><button id="behind">Behind wall</button><br><button id="random">F · Greeting wave</button><select id="gesture"><option>Wave</option><option>Explain</option><option>Shrug</option><option>Agree</option></select><button id="pose">Inspect pose</button><label>Time <input id="time" type="range" min="0" max="4" step="0.05" value="1.3"></label><button id="resume">Resume</button><div id="status">Loading…</div></nav><div id="hint"></div>
<script type="module">
import * as THREE from 'three';
import {state} from '/src/state.ts';
import {gothGirlfriend,rebuildEnvironmentWithSeed,updateEnvironmentVisibility} from '/src/world.ts';
import {generateTownLayout} from '/src/town.ts';
state.scene=new THREE.Scene();state.scene.background=new THREE.Color(0xd0dbf0);
state.scene.add(new THREE.AmbientLight(0x777777));const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(750,1500,750);state.scene.add(sun);
state.camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1500);state.isMultiplayer=false;state.controls={getObject:()=>state.camera};
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
let paused=false;let last=0;let lastResult='';
function view(name){const b=generateTownLayout(Number(document.querySelector('#seed').value)).find(b=>b.name==='goth house');const p=gothGirlfriend.group.position;state.camera.position.copy(p);state.camera.position.y=2;state.camera.position[b.doorAxis]-=b.doorSide*(name==='close'?3.2:name==='behind'?-12:14);state.camera.lookAt(p.x,1.55,p.z);updateEnvironmentVisibility(state.camera.position,2);}
function rebuild(){rebuildEnvironmentWithSeed(Number(document.querySelector('#seed').value));paused=false;view('close');}rebuild();
function interact(){paused=false;lastResult=gothGirlfriend.interact(state.camera,state.obstacles)?'Interaction accepted':'Interaction blocked (range, wall, or gesture still playing)';}
function pose(){if(!gothGirlfriend.animator)return;const a=gothGirlfriend.animator;a.update(5);a.play(document.querySelector('#gesture').value);a.update(Number(document.querySelector('#time').value));paused=true;}
document.querySelector('#rebuild').onclick=rebuild;for(const name of ['close','door','behind'])document.getElementById(name).onclick=()=>view(name);
document.querySelector('#random').onclick=interact;document.querySelector('#pose').onclick=pose;document.querySelector('#time').oninput=pose;document.querySelector('#gesture').onchange=pose;document.querySelector('#resume').onclick=()=>paused=false;
addEventListener('keydown',e=>{if(e.code==='KeyF'&&!e.repeat)interact();});
function animate(time){requestAnimationFrame(animate);const delta=Math.min((time-last)/1000,.05);last=time;gothGirlfriend?.update(paused?0:delta);renderer.render(state.scene,state.camera);document.querySelector('#status').textContent=gothGirlfriend.loadError?'Load failed':!gothGirlfriend.animator?'Loading…':`${gothGirlfriend.animator.gesture??'Idle'} · ${paused?'Paused pose':'Live'} · ${lastResult}`;document.querySelector('#hint').textContent=gothGirlfriend.canInteract(state.camera,state.obstacles)?'[F] Talk to goth girlfriend':'';}requestAnimationFrame(animate);
addEventListener('resize',()=>{state.camera.aspect=innerWidth/innerHeight;state.camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
