<!doctype html><html lang="en"><meta charset="utf-8"><title>Goth girlfriend · local conversation test</title>
<style>body{margin:0;background:#17131d;color:#eee;font:14px system-ui}canvas{display:block}nav{position:fixed;top:12px;left:12px;background:#201726ed;padding:14px;border-radius:8px;z-index:10}button{padding:9px;margin:4px}#status{margin:6px}</style>
<nav><strong>Local conversation test</strong><br><button id="talk">F · Talk to your girlfriend</button><button id="rebuild">Rebuild world</button><div id="status">Loading character…</div></nav>
<script type="module">
import * as THREE from 'three';
import {state} from '/src/state.ts';
import {gothGirlfriend,rebuildEnvironmentWithSeed,updateEnvironmentVisibility} from '/src/world.ts';
import {GothChat} from '/src/gothChat.ts';
import {ConversationCamera} from '/src/conversationCamera.ts';
import {getGothConversationPose,GOTH_FACE_HEIGHT} from '/src/gothGirlfriend.ts';
state.scene=new THREE.Scene();state.scene.background=new THREE.Color(0xd0dbf0);state.scene.add(new THREE.AmbientLight(0x777777));const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(750,1500,750);state.scene.add(sun);
state.camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1500);state.isMultiplayer=false;state.controls={getObject:()=>state.camera};
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
let seed=42;let last=0;
const movement=new ConversationCamera();
const chat=new GothChat({onOpen:()=>{const pose=getGothConversationPose(gothGirlfriend.group);movement.start(state.camera,pose.position,pose.lookAt);},onClose:()=>movement.cancel(),onReplyStart:()=>gothGirlfriend?.startTalking()});
function rebuild(){chat.reset();rebuildEnvironmentWithSeed(seed++);const p=gothGirlfriend.group.position;state.camera.position.copy(p).add(new THREE.Vector3(1.4,0,2.8).applyQuaternion(gothGirlfriend.group.quaternion));state.camera.position.y=2;state.camera.lookAt(p.x+.35,GOTH_FACE_HEIGHT-.3,p.z);updateEnvironmentVisibility(state.camera.position,2);}rebuild();
function talk(){if(!chat.isOpen&&gothGirlfriend.interact(state.camera,state.obstacles))chat.open();}
document.querySelector('#talk').onclick=talk;document.querySelector('#rebuild').onclick=rebuild;addEventListener('keydown',e=>{if(e.code==='KeyF'&&!e.repeat)talk();});
function animate(time){requestAnimationFrame(animate);gothGirlfriend.update(Math.min((time-last)/1000,.05));movement.update(Math.min((time-last)/1000,.05));last=time;renderer.render(state.scene,state.camera);document.querySelector('#status').textContent=gothGirlfriend.animator?`Character: ${gothGirlfriend.animator.gesture??'Idle'}`:'Loading character…';}requestAnimationFrame(animate);
addEventListener('resize',()=>{state.camera.aspect=innerWidth/innerHeight;state.camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
